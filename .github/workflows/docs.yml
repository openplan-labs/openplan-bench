# Deploy the leaderboard to GitHub Pages.
#
# The site is regenerated here rather than trusting whatever is committed under
# docs/, so the published dashboard always matches the results files in the
# repository. If someone hand-edits docs/, this quietly overwrites it — which
# is the correct outcome for a page whose entire claim is that it reflects the
# committed data.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "docs/**"
      - "openplan_bench/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No planner extras: building the site reads results files, it does not
      # run anything.
      - run: pip install -e .

      - name: regenerate the dashboard from the committed results
        run: python -m openplan_bench site --results results/ --out docs/

      - name: sanity-check the output
        run: |
          test -f docs/index.html
          test -f docs/methodology.html
          test -f docs/reproduce.html
          test -f docs/.nojekyll
          grep -q "openplan-bench" docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
